
<!DOCTYPE html>
<html>
<head>

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Happy Rakshabandhan Akka ❤️</title>

<style>

* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
}

body {
    background: white;
    font-family: Arial, sans-serif;
    overflow: hidden;
}

.screen {
    width: 100vw;
    height: 100vh;

    display: flex;
    flex-direction: column;

    justify-content: center;
    align-items: center;

    text-align: center;

    padding: 20px;
}

.title {
    font-size: clamp(45px, 13vw, 110px);

    font-weight: bold;

    line-height: 1.05;

    color: #e60000;

    margin-bottom: 35px;

    /* WHITE OUTLINE */
    text-shadow:
        -5px -5px 0 white,
         5px -5px 0 white,
        -5px  5px 0 white,
         5px  5px 0 white,
        -5px  0px 0 white,
         5px  0px 0 white,
         0px -5px 0 white,
         0px  5px 0 white;
}


/* RAKHI */

.rakhi {
    width: 85%;
    max-width: 600px;

    height: 120px;

    display: flex;

    align-items: center;

    justify-content: center;

    position: relative;
}

.thread {
    width: 100%;
    height: 8px;

    border-radius: 10px;

    background: linear-gradient(
        90deg,
        #8b0000,
        #ff0000,
        #ffd700,
        #ff0000,
        #8b0000
    );
}

.center {
    position: absolute;

    width: 100px;
    height: 100px;

    border-radius: 50%;

    background:
        radial-gradient(
            circle,
            #ffd700 10%,
            #ff0000 35%,
            #8b0000 75%
        );

    border: 8px solid #ffd700;

    box-shadow: 0 0 18px #aaa;

    display: flex;

    align-items: center;

    justify-content: center;
}

.center::before {
    content: "✦";

    color: white;

    font-size: 55px;
}


/* HEARTS */

.hearts {
    font-size: 42px;

    margin-top: 20px;

    animation: heartbeat 1.2s infinite;
}

@keyframes heartbeat {

    50% {
        transform: scale(1.15);
    }

}


/* QUOTE */

.message {

    margin-top: 25px;

    font-size: clamp(20px, 5vw, 34px);

    color: #222;

    font-style: italic;

}

</style>

</head>


<body>

<div class="screen">

    <div class="title">
        I Am So Lucky To Have A<br>Sister Like You
    </div>


    <div class="rakhi">

        <div class="thread"></div>

        <div class="center"></div>

    </div>


    <div class="hearts">
        ❤️ 💕 ❤️
    </div>


    <div class="message">
        Happy Rakshabandhan Akka. ❤️
    </div>

</div>

</body>

</html>
